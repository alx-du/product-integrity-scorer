<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClearCart — Product Integrity Scorer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 360px;
      min-height: 480px;
      background: #fff;
      color: #1a1a1a;
    }

    .header {
      background: #1a1a2e;
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header .subtitle { font-size: 11px; opacity: 0.7; margin-top: 2px; }

    .product-name {
      padding: 14px 16px 8px;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid #eee;
      color: #333;
    }

    .pillars { padding: 8px 0; }

    .pillar {
      padding: 12px 16px;
      border-bottom: 1px solid #f5f5f5;
      cursor: pointer;
    }
    .pillar:hover { background: #fafafa; }

    .pillar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .pillar-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
    }
    /* The value slot holds "4/5" when evidence exists, and a glyph when it
       does not. An absence is grey and unfilled — never the red of a bad
       result. Painting "nobody will tell you" as a failing grade blames the
       product for the information environment around it. */
    .pillar-score {
      font-size: 18px;
      font-weight: 700;
    }
    .pillar-score--pass   { color: #22a853; }
    .pillar-score--below  { color: #ef4444; }
    .pillar-score--absent { color: #9aa0a6; font-weight: 500; }

    /* Five discrete steps, not a percentage bar. The scale has six points
       (0–5) and a bar implies a continuum that can always be part-filled —
       which leaves no way to show a dimension that has no value at all. */
    .dimension-steps {
      margin-top: 6px;
      display: flex;
      gap: 3px;
    }
    .step {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: #eee;
    }
    .step--filled { background: #22a853; }
    .step--below  { background: #ef4444; }
    /* Unknown and Claimed fill nothing: an outline, so the row reads as
       "not established" rather than "scored zero". */
    .dimension-steps--absent .step {
      background: transparent;
      border: 1px dashed #d5d7da;
      height: 4px;
    }

    .coverage-tag {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
      background: #f1f3f4;
      color: #5f6368;
      margin-left: 6px;
    }
    .coverage-tag--scored   { background: #e6f4ea; color: #137333; }
    .coverage-tag--inferred { background: #fef7e0; color: #b06000; }
    .coverage-tag--claimed  { background: #fce8e6; color: #a50e0e; }
    .coverage-tag--unknown  { background: #f1f3f4; color: #5f6368; }

    .pillar-detail {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f0f0f0;
    }
    .pillar.open .pillar-detail { display: block; }

    .indicator {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: #555;
      margin-bottom: 6px;
    }
    .confidence-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 3px;
    }
    .confidence-dot--high { background: #22a853; }
    .confidence-dot--mid  { background: #f59e0b; }
    .confidence-dot--low  { background: #ef4444; }

    .source-tag {
      font-size: 10px;
      color: #999;
      margin-left: 16px;
    }

    .footer {
      padding: 12px 16px;
      font-size: 11px;
      color: #aaa;
      text-align: center;
      border-top: 1px solid #eee;
    }
    .footer a { color: #666; text-decoration: none; }

    #no-product {
      padding: 32px 16px;
      text-align: center;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>ClearCart</h1>
      <div class="subtitle">Five dimensions, assessed independently</div>
    </div>
  </div>

  <div id="product-view" style="display:none">
    <div id="product-name" class="product-name">Loading...</div>

    <div class="pillars" id="pillars-container">
      <!-- Dimension rows injected by popup.js -->
    </div>

    <div class="footer">
      Assessments cite their sources. Dimensions are never combined.
      <a href="#" id="methodology-link">How this works</a>
    </div>
  </div>

  <div id="no-product">
    <p>Navigate to a supported product page to see its assessment.</p>
    <br/>
    <p style="font-size:11px">Supported: Trader Joe's</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
